<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#141824"/>
  <meta name="description" content="Teravel Industries — Không gian làm việc và hướng dẫn dự án Jumper AI Lab."/>
  <title>Teravel Industries — Jumper AI Lab</title>
  <script>
    try {
      var preference = localStorage.getItem('teravel-theme');
      document.documentElement.dataset.theme = preference === 'light' || (preference === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches) ? 'light' : 'dark';
    } catch (_) {}
  </script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
